<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    :root {
      --text: #1f2937;
      --muted: #5b6573;
      --border: #dbe3ea;
      --surface: #f8fafc;
      --accent: #1565c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 1180px;
      padding: 32px 24px 80px;
      color: var(--text);
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      line-height: 1.65;
    }
    .page-header {
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
      padding-bottom: 16px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .meta { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; }
    h1, h2, h3, h4 { line-height: 1.28; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    h2 {
      border-bottom: 2px solid #e5e7eb;
      font-size: 1.4rem;
      margin-top: 36px;
      padding-bottom: 6px;
    }
    h3 { font-size: 1.12rem; margin-top: 26px; }
    p { margin: 10px 0; }
    a { color: var(--accent); }
    code {
      background: #f3f4f6;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 0.88em;
    }
    pre {
      background: #0f172a;
      border-radius: 8px;
      color: #e5e7eb;
      overflow-x: auto;
      padding: 14px 16px;
    }
    pre code { background: transparent; color: inherit; padding: 0; }
    blockquote {
      border-left: 4px solid var(--accent);
      color: var(--muted);
      margin: 16px 0;
      padding: 4px 0 4px 16px;
    }
    table {
      border-collapse: collapse;
      font-size: 0.86rem;
      margin: 14px 0 22px;
      width: 100%;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }
    th { background: var(--surface); font-weight: 700; }
    tr:nth-child(even) td { background: #fbfcfd; }
    img {
      border: 1px solid var(--border);
      border-radius: 8px;
      display: block;
      height: auto;
      margin: 14px 0;
      max-width: 100%;
    }
    .toc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 22px 0;
      padding: 16px 20px;
    }
    .toc ul { margin: 0; padding-left: 20px; }
    .toc li { margin: 3px 0; }
    .note {
      background: #fff8e6;
      border: 1px solid #f0d58c;
      border-radius: 8px;
      padding: 10px 14px;
    }
    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 48px;
      padding-top: 14px;
    }
    @media (max-width: 900px) {
      body { padding: 20px 14px 56px; }
      table { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="eyebrow">Name That LLM · Exploratory Data Analysis</div>
    <p class="meta">Dibuat $generated_at</p>
  </header>
  <main>
$body
  </main>
  <footer>
    Laporan dihasilkan otomatis oleh paket <code>llm_eda</code>. Tabel lengkap tersedia
    di folder <code>tables/</code>, sedangkan grafik tersedia di folder <code>figures/</code>.
  </footer>
</body>
</html>
